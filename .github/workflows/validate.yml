name: Validate skill package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run helper tests
        run: python -m unittest discover -s tests -v
      - name: Check helper command interfaces
        run: |
          python scripts/score_papers.py --help
          python scripts/fetch_papers.py --help
          python scripts/extract_pdf_figures.py --help
          python scripts/build_contact_sheet.py --help
          python scripts/validate_svg.py --help
          python scripts/render_diagram.py --help
          python scripts/render_diagram.py --list-icons
          python scripts/plan_diagram.py --help
          python scripts/prepare_icon.py --help
          python scripts/render_diagram.py templates/parallel-study.json --check-only
          python scripts/render_diagram.py templates/parallel-study.json --layout-only

  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned rendering test dependencies
        run: python -m pip install matplotlib==3.10.7 Pillow==11.3.0 PyMuPDF==1.26.6
      - name: Exercise actual exports and failure cases
        run: python -m unittest discover -s tests -v
      - name: Render the parallel example
        run: |
          python scripts/render_diagram.py templates/parallel-study.json --output-dir diagram-output --stem methodology
          python scripts/validate_svg.py diagram-output/methodology.svg
          python scripts/render_diagram.py templates/decision-workflow.json --output-dir diagram-output --stem decision
          python scripts/validate_svg.py diagram-output/decision.svg
          python scripts/render_diagram.py templates/conceptual-framework.json --output-dir diagram-output --stem conceptual
          python scripts/validate_svg.py diagram-output/conceptual.svg
          python scripts/render_diagram.py templates/icon-workflow/diagram.json --output-dir diagram-output --stem icons
          python scripts/validate_svg.py diagram-output/icons.svg
          python scripts/render_diagram.py templates/ml-architecture.json --output-dir diagram-output --stem ml-arch --drawio --eps
          python scripts/validate_svg.py diagram-output/ml-arch.svg
          python scripts/render_diagram.py templates/multi-panel-method.json --output-dir diagram-output --stem multi-panel --drawio
          python scripts/validate_svg.py diagram-output/multi-panel.svg
      - name: Build a figure directly from sourced method stages
        run: |
          python scripts/plan_diagram.py --doctor
          python scripts/plan_diagram.py templates/review-selection-method.json --output-dir diagram-output --stem selection --drawio --tiff --require-sources
          python scripts/validate_svg.py diagram-output/selection.svg
